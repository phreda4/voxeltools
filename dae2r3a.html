<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>dae2r3a</title>
<style>
body{font:14px monospace;background:#111;color:#ddd;padding:20px;max-width:700px;margin:auto}
h1{font-size:18px}
#drop{border:2px dashed #555;padding:40px;text-align:center;cursor:pointer}
#drop.over{border-color:#0f0}
#log{white-space:pre-wrap;margin-top:15px;background:#000;padding:10px;min-height:100px}
a{color:#0f0}
</style>
</head>
<body>
<h1>dae2r3a</h1>
<div id="drop">arrastra un .dae aqui o hace click</div>
<input type="file" id="file" accept=".dae" style="display:none">
<div id="log"></div>
<div id="dl"></div>

<script>
const MAX_FRAMES=4096;
const log=m=>document.getElementById('log').textContent+=m+"\n";

const drop=document.getElementById('drop'), inp=document.getElementById('file');
drop.onclick=()=>inp.click();
drop.ondragover=e=>{e.preventDefault();drop.className='over';};
drop.ondragleave=()=>drop.className='';
drop.ondrop=e=>{e.preventDefault();drop.className='';handle(e.dataTransfer.files[0]);};
inp.onchange=()=>handle(inp.files[0]);

function handle(file){
  if(!file) return;
  document.getElementById('log').textContent='';
  document.getElementById('dl').innerHTML='';
  const r=new FileReader();
  r.onload=()=>convert(file.name, r.result);
  r.readAsText(file);
}

/* ── math ── */
const PI=Math.PI;
function deg2rad(d){ return d*PI/180.0; }
function quatToEulerXYZturns(qx,qy,qz,qw){
  const x2=qx*qx,y2=qy*qy,z2=qz*qz, xy=qx*qy,xz=qx*qz,yz=qy*qz, wx=qw*qx,wy=qw*qy,wz=qw*qz;
  const m00=1-2*(y2+z2);
  const m10=2*(xy+wz), m11=1-2*(x2+z2), m12=2*(yz-wx);
  const m20=2*(xz-wy), m21=2*(yz+wx), m22=1-2*(x2+y2);
  let sy=-m20; if(sy>1)sy=1; if(sy<-1)sy=-1;
  const ey=Math.asin(sy)/(2*PI);
  const cy=Math.cos(Math.asin(sy));
  let ex,ez;
  if(Math.abs(cy)>1e-6){ ex=Math.atan2(m21/cy,m22/cy)/(2*PI); ez=Math.atan2(m10/cy,m00/cy)/(2*PI); }
  else { ex=Math.atan2(-m12,m11)/(2*PI); ez=0; }
  return [ex,ey,ez];
}
function axisAngleToQuat(ax,ay,az,rad){
  const s=Math.sin(rad*0.5);
  return [ax*s,ay*s,az*s,Math.cos(rad*0.5)];
}
function qmul(ax,ay,az,aw,bx,by,bz,bw){
  return [
    aw*bx+ax*bw+ay*bz-az*by,
    aw*by-ax*bz+ay*bw+az*bx,
    aw*bz+ax*by-ay*bx+az*bw,
    aw*bw-ax*bx-ay*by-az*bz
  ];
}
function mat4colToQuat(m){
  const m00=m[0],m10=m[1],m20=m[2], m01=m[4],m11=m[5],m21=m[6], m02=m[8],m12=m[9],m22=m[10];
  const tr=m00+m11+m22;
  let qx,qy,qz,qw;
  if(tr>0){ const s=0.5/Math.sqrt(tr+1); qw=0.25/s; qx=(m21-m12)*s; qy=(m02-m20)*s; qz=(m10-m01)*s; }
  else if(m00>m11&&m00>m22){ const s=2*Math.sqrt(1+m00-m11-m22); qw=(m21-m12)/s; qx=0.25*s; qy=(m01+m10)/s; qz=(m02+m20)/s; }
  else if(m11>m22){ const s=2*Math.sqrt(1+m11-m00-m22); qw=(m02-m20)/s; qx=(m01+m10)/s; qy=0.25*s; qz=(m12+m21)/s; }
  else { const s=2*Math.sqrt(1+m22-m00-m11); qw=(m10-m01)/s; qx=(m02+m20)/s; qy=(m12+m21)/s; qz=0.25*s; }
  return [qx,qy,qz,qw];
}
/* Descompone matriz COLLADA fila-mayor (16 floats) en T, R(quat), S */
function mat4rowDecompose(m){
  const tx=m[3], ty=m[7], tz=m[11];
  const sx=Math.hypot(m[0],m[4],m[8]), sy=Math.hypot(m[1],m[5],m[9]), sz=Math.hypot(m[2],m[6],m[10]);
  let sc=Math.max(sx,sy,sz); if(sc<1e-6) sc=1;
  const cm=[
    sx>1e-6?m[0]/sx:m[0], sx>1e-6?m[4]/sx:m[4], sx>1e-6?m[8]/sx:m[8], 0,
    sy>1e-6?m[1]/sy:m[1], sy>1e-6?m[5]/sy:m[5], sy>1e-6?m[9]/sy:m[9], 0,
    sz>1e-6?m[2]/sz:m[2], sz>1e-6?m[6]/sz:m[6], sz>1e-6?m[10]/sz:m[10], 0,
    0,0,0,1
  ];
  const [qx,qy,qz,qw]=mat4colToQuat(cm);
  return {tx,ty,tz,qx,qy,qz,qw,sc};
}

/* ── helpers XML (DOMParser) ── */
const NS="http://www.collada.org/2005/11/COLLADASchema";
function children(el, tag){
  return el ? Array.from(el.children).filter(c=>localName(c)===tag) : [];
}
function child(el, tag){ return children(el,tag)[0]||null; }
function localName(el){ return el.tagName.includes(':')?el.tagName.split(':')[1]:el.tagName; }
function parseFloats(s){
  return (s||'').trim().split(/[\s,]+/).filter(x=>x.length).map(Number);
}

/* ── sources ── */
function parseSources(doc){
  const map={};
  doc.querySelectorAll('source').forEach(src=>{
    const id=src.getAttribute('id'); if(!id) return;
    const fa=child(src,'float_array');
    if(!fa) return;
    const data=parseFloats(fa.textContent);
    const acc=child(child(src,'technique_common'),'accessor');
    let stride=1;
    if(acc && acc.getAttribute('stride')) stride=parseInt(acc.getAttribute('stride'),10)||1;
    map[id]={data,stride,count:data.length};
  });
  return map;
}

/* ── skeleton ── */
function parseSkeleton(doc){
  const joints=[]; const sidmap={};
  function sidAdd(sid,ji){ if(sid && !(sid in sidmap)) sidmap[sid]=ji; }

  function nodeLocalTRS(nodeEl){
    let tx=0,ty=0,tz=0, qx=0,qy=0,qz=0,qw=1, sc=1;
    const mat=child(nodeEl,'matrix');
    if(mat){
      const m=parseFloats(mat.textContent);
      if(m.length===16){
        const r=mat4rowDecompose(m);
        return {tx:r.tx,ty:r.ty,tz:r.tz,qx:r.qx,qy:r.qy,qz:r.qz,qw:r.qw,sc:r.sc};
      }
    }
    // procesar translate/rotate/scale en orden de aparicion
    Array.from(nodeEl.children).forEach(el=>{
      const tag=localName(el);
      if(tag==='translate'){
        const v=parseFloats(el.textContent); tx=v[0]||0; ty=v[1]||0; tz=v[2]||0;
      } else if(tag==='rotate'){
        const v=parseFloats(el.textContent);
        const [rqx,rqy,rqz,rqw]=axisAngleToQuat(v[0]||0,v[1]||0,v[2]||0,deg2rad(v[3]||0));
        [qx,qy,qz,qw]=qmul(qx,qy,qz,qw,rqx,rqy,rqz,rqw);
      } else if(tag==='scale'){
        const v=parseFloats(el.textContent); sc=Math.max(v[0]||1,v[1]||1,v[2]||1);
      }
    });
    return {tx,ty,tz,qx,qy,qz,qw,sc};
  }

  function parseNode(nodeEl, parentJi){
    const type=nodeEl.getAttribute('type')||'';
    const isJoint=(type==='JOINT'||type==='joint');
    let ji=-1;
    if(isJoint){
      const id=nodeEl.getAttribute('id')||'', sid=nodeEl.getAttribute('sid')||'', name=nodeEl.getAttribute('name')||'';
      ji=joints.length;
      const trs=nodeLocalTRS(nodeEl);
      const jt={
        idx:ji, parent:parentJi,
        name: name||sid||id||('joint_'+ji),
        sid: sid||id,
        tx:trs.tx, ty:trs.ty, tz:trs.tz,
        rx:trs.qx, ry:trs.qy, rz:trs.qz, rw:trs.qw,
        s:trs.sc
      };
      joints.push(jt);
      sidAdd(sid,ji); sidAdd(id,ji); sidAdd(name,ji);
    }
    children(nodeEl,'node').forEach(c=>parseNode(c, isJoint?ji:parentJi));
  }

  const vs=doc.querySelector('visual_scene');
  if(!vs){ log('[WARN] sin visual_scene'); return {joints,sidmap}; }
  children(vs,'node').forEach(n=>parseNode(n,-1));
  log('[INFO] joints: '+joints.length+'  sidmap: '+Object.keys(sidmap).length);
  return {joints,sidmap};
}

/* ── animations ── */
/* tipos: 0=T 1=R(quat) 2=S 3=matriz4x4 */
function parseTarget(target, sidmap){
  const noParam=target.split('(')[0];
  const parts=noParam.split('/');
  if(parts.length===0) return null;
  let ji=-1;
  for(let i=0;i<parts.length-1 && ji<0;i++) ji=sidmap[parts[i]]!==undefined?sidmap[parts[i]]:-1;
  if(ji<0 && parts.length===1) ji=sidmap[parts[0]]!==undefined?sidmap[parts[0]]:-1;
  if(ji<0) return null;
  const path=parts.length>1?parts[parts.length-1]:null;
  let type=-1, comp=-1;
  if(!path){ return {ji,type:3,comp:-1}; }
  if(path.startsWith('matrix')||path.startsWith('transform')) type=3;
  else if(path.startsWith('location')||path.startsWith('translate')){
    type=0;
    if(path.includes('.X')||path.includes('[0]')) comp=0;
    else if(path.includes('.Y')||path.includes('[1]')) comp=1;
    else if(path.includes('.Z')||path.includes('[2]')) comp=2;
  } else if(path.startsWith('rotation')||path.startsWith('rotate')){
    type=1;
    if(path.includes('X.ANGLE')||path.includes('.X')) comp=0;
    else if(path.includes('Y.ANGLE')||path.includes('.Y')) comp=1;
    else if(path.includes('Z.ANGLE')||path.includes('.Z')) comp=2;
    else if(path.includes('W.ANGLE')||path.includes('.W')) comp=3;
  } else if(path.startsWith('scale')) type=2;
  if(type<0) return null;
  return {ji,type,comp};
}

function parseAnimLeaf(animEl, sources, sidmap, rawch){
  const chEl=child(animEl,'channel'); if(!chEl) return;
  const src=chEl.getAttribute('source')||'', tgt=chEl.getAttribute('target')||'';
  const sampId=src.startsWith('#')?src.slice(1):src;
  const sampEl=Array.from(children(animEl,'sampler')).find(s=>s.getAttribute('id')===sampId);
  if(!sampEl) return;
  let inpId='',outId='';
  children(sampEl,'input').forEach(inEl=>{
    const sem=inEl.getAttribute('semantic'), s=inEl.getAttribute('source')||'';
    const sid=s.startsWith('#')?s.slice(1):s;
    if(sem==='INPUT') inpId=sid;
    if(sem==='OUTPUT') outId=sid;
  });
  if(!inpId||!outId) return;
  const srcT=sources[inpId], srcV=sources[outId];
  if(!srcT||!srcV) return;
  const t=parseTarget(tgt,sidmap);
  if(!t) return;
  const nkeys=Math.min(srcT.count, MAX_FRAMES);
  const times=srcT.data.slice(0,nkeys);
  const stride=srcV.stride;
  const vals=srcV.data.slice(0, nkeys*stride);
  rawch.push({ji:t.ji, type:t.type, comp:t.comp, stride, nkeys, times, vals});
}

function parseAnimChildren(animEl, sources, sidmap, rawch){
  children(animEl,'animation').forEach(a=>{
    if(child(a,'channel')) parseAnimLeaf(a, sources, sidmap, rawch);
    else parseAnimChildren(a, sources, sidmap, rawch);
  });
}

function parseAnimations(doc, sources, sidmap){
  const lib=doc.querySelector('library_animations');
  if(!lib){ log('[WARN] sin library_animations'); return []; }
  const rawch=[];
  parseAnimChildren(lib, sources, sidmap, rawch);
  if(rawch.length===0){ log('[WARN] sin canales de animacion'); return []; }
  log('[INFO] canales raw: '+rawch.length);

  const clip=doc.querySelector('animation_clip');
  const name = clip ? (clip.getAttribute('id')||'anim_0') : 'anim_0';
  const anim={name, duration:0, ch:[]};

  rawch.forEach(rc=>{
    if(rc.type===3){
      const cht={joint:rc.ji,type:0,keys:[]};
      const chr={joint:rc.ji,type:1,keys:[]};
      const chs={joint:rc.ji,type:2,keys:[]};
      for(let k=0;k<rc.nkeys;k++){
        const t=rc.times[k]; if(t>anim.duration) anim.duration=t;
        const m=rc.vals.slice(k*16,k*16+16);
        const r=mat4rowDecompose(m);
        cht.keys.push({t,v:[r.tx,r.ty,r.tz]});
        chr.keys.push({t,v:[r.qx,r.qy,r.qz,r.qw]});
        chs.keys.push({t,v:[r.sc]});
      }
      anim.ch.push(cht,chr,chs);
    } else {
      const ch={joint:rc.ji,type:rc.type,keys:[]};
      for(let k=0;k<rc.nkeys;k++){
        const t=rc.times[k]; if(t>anim.duration) anim.duration=t;
        let v=rc.vals.slice(k*rc.stride,k*rc.stride+rc.stride);
        if(rc.type===1 && rc.stride===1 && rc.comp>=0){
          const deg=rc.vals[k*rc.stride];
          const ax=rc.comp===0?1:0, ay=rc.comp===1?1:0, az=rc.comp===2?1:0;
          v=axisAngleToQuat(ax,ay,az,deg2rad(deg));
        }
        ch.keys.push({t,v});
      }
      anim.ch.push(ch);
    }
  });
  log('[INFO] canales bake: '+anim.ch.length);
  return [anim];
}

/* ── bake ── */
function chSample(ch,t){
  let ki=0;
  for(let k=1;k<ch.keys.length;k++){ if(ch.keys[k].t<=t) ki=k; else break; }
  return ch.keys[ki].v;
}
function sampleJoint(joints, anim, ji, t){
  const j=joints[ji];
  let tx=j.tx,ty=j.ty,tz=j.tz, rx=j.rx,ry=j.ry,rz=j.rz,rw=j.rw, s=j.s;
  anim.ch.forEach(ch=>{
    if(ch.joint!==ji) return;
    const v=chSample(ch,t);
    if(ch.type===0){ tx=v[0];ty=v[1];tz=v[2]; }
    else if(ch.type===1){ rx=v[0];ry=v[1];rz=v[2];rw=v[3]; }
    else if(ch.type===2){ s=v[0]; }
  });
  const [ex,ey,ez]=quatToEulerXYZturns(rx,ry,rz,rw);
  return {tx,ty,tz,ex,ey,ez,s};
}

/* ── main convert ── */
function convert(name, text){
  if(!/COLLADA/i.test(text)){ log('[ERROR] no parece un archivo COLLADA'); return; }
  log('[INFO] DAE '+text.length+' bytes');

  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.querySelector('parsererror')){ log('[ERROR] XML invalido'); return; }

  const sources=parseSources(doc);
  log('[INFO] sources: '+Object.keys(sources).length);

  const {joints,sidmap}=parseSkeleton(doc);
  const anims=parseAnimations(doc, sources, sidmap);
  log('[INFO] joints:'+joints.length+'  anims:'+anims.length);

  let out='';
  out+='# R3a — Skeleton & Animation (baked, Euler XYZ en vueltas)\n';
  out+='# Rotacion: 1.0 = 360 grados, 0.5 = 180 grados\n';
  out+='# JOINT  idx "name" parent  tx ty tz  ex ey ez  s\n';
  out+='# STEP   n t\n';
  out+='#   ji  tx ty tz  ex ey ez  s\n\n';
  out+='SKELETON '+joints.length+'\n';
  joints.forEach(j=>{
    const [ex,ey,ez]=quatToEulerXYZturns(j.rx,j.ry,j.rz,j.rw);
    out+='  JOINT '+j.idx+' "'+j.name+'" '+j.parent+'  '
      +j.tx.toFixed(6)+' '+j.ty.toFixed(6)+' '+j.tz.toFixed(6)+'  '
      +ex.toFixed(6)+' '+ey.toFixed(6)+' '+ez.toFixed(6)+'  '+j.s.toFixed(6)+'\n';
  });
  out+='END_SKELETON\n\nANIMATIONS '+anims.length+'\n\n';

  anims.forEach(anim=>{
    const steps=[];
    anim.ch.forEach(ch=>ch.keys.forEach(k=>{
      if(!steps.some(x=>Math.abs(x-k.t)<1e-6)) steps.push(k.t);
    }));
    steps.sort((a,b)=>a-b);
    out+='ANIM "'+anim.name+'" '+steps.length+' '+anim.duration.toFixed(6)+'\n';
    steps.forEach((t,si)=>{
      out+='  STEP '+si+' '+t.toFixed(6)+'\n';
      for(let ji=0;ji<joints.length;ji++){
        const r=sampleJoint(joints,anim,ji,t);
        out+='    '+ji+'  '+r.tx.toFixed(6)+' '+r.ty.toFixed(6)+' '+r.tz.toFixed(6)+'  '
          +r.ex.toFixed(6)+' '+r.ey.toFixed(6)+' '+r.ez.toFixed(6)+'  '+r.s.toFixed(6)+'\n';
      }
    });
    out+='END_ANIM\n\n';
    log('     ['+0+'] "'+anim.name+'" '+anim.duration.toFixed(3)+'s  '+steps.length+' steps  '+joints.length+' joints');
  });

  const blob=new Blob([out], {type:'text/plain'});
  const outName=name.replace(/\.dae$/i,'')+'.r3a';
  const url=URL.createObjectURL(blob);

  log('[OK] '+outName+' ('+blob.size+' bytes)');

  const a=document.createElement('a');
  a.href=url; a.download=outName; a.textContent='descargar '+outName;
  a.style.display='block';
  a.style.marginTop='10px';
  document.getElementById('dl').appendChild(a);
}
</script>
</body>
</html>
